# geociteops 前端 nginx 配置
#
# 职责：托管 vite 构建产物 + 把后端路由反代到 app:4000。
#
# 反代前缀按后端**实际注册的路由**列，不是猜的：
#   /trpc     —— tRPC 插件挂载点（src/server.ts）
#   /files/   —— 回单/发票下载 GET /files/:key（src/server.ts）
#   /health   —— 健康检查 GET /health（src/server.ts）
#   /webhooks —— 支付回调 POST /webhooks/pay/:channel（src/server.ts）。
#                M1 的 mock 渠道不经此路由（前端走 tRPC 确认），但 M2 真实微信支付
#                的服务器间回调打到这里，漏代理会让回调落进 SPA fallback 返回 HTML，
#                支付确认从秒级退化为等 04:30 对账 cron 兜底。
# 四者合并进一条正则 location。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 回单/发票上传走 tRPC mutation（base64，zod 限 ≤7MB），留出 base64 膨胀余量
    client_max_body_size 10m;

    # Docker 内嵌 DNS（127.0.0.11）。app 容器重建后 IP 会变，
    # 若用静态 proxy_pass + 启动时解析，nginx 会一直拿着旧 IP → 502。
    # 用变量 + $request_uri 在请求期解析解决。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 后端路由：tRPC / 文件下载 / 健康检查 / 支付回调
    location ~ ^/(trpc|files|health|webhooks) {
        set $upstream http://app:4000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端据此判断 https，从而决定会话 Cookie 是否下发
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # SPA 静态资源：命中文件直接返回，其余一律回 index.html 交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物长期缓存（vite 默认产物名含内容 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

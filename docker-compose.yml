# geociteops 一键部署栈（规格 §3.1）
#
# 四服务：db / migrate / app / web
# worker 不拆独立容器——citation-scheduler、order-activate、billing-crons、
# diagnostic-workers 及内联的 session.purge / payment.reconcile 全部与 Fastify
# 同进程启动（src/server.ts），且 zvec 是进程内嵌入式库、mock 支付渠道是进程内
# 内存注册表，拆进程会导致向量库双开与"逐调用互不可见"。详见规格 §2 非目标。
#
# 使用：
#   cp .env.example .env   # 至少改 CREDENTIAL_MASTER_KEY 与 PAY_MOCK_SECRET
#   docker compose up -d
#   → http://localhost:5170/login
#
# Railway can import this file onto a project canvas. The web container proxies
# to app:4000. Override GEO_API_UPSTREAM if the platform's private DNS differs.
# Public read-only demo: set DEMO_MODE=on (see docs/deploy.md). Default is off.

services:
  # ---------- db：Postgres + pgvector ----------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo}']
      interval: 5s
      timeout: 5s
      retries: 30
    # 不向宿主机发布 5432：避免与宿主机上已有 Postgres 撞端口。
    mem_limit: 512m

  # ---------- migrate：一次性迁移 ----------
  # 独立成服务而非并入 app 启动流程：schema 未就绪时 pg-boss / worker 抢跑会直接崩。
  # app 用 condition: service_completed_successfully 严格依赖它成功退出。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_secret}@db:5432/${POSTGRES_DB:-geo}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # ---------- app：API + 全部 worker + zvec ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      # compose 内部走服务名 db，不读 .env 里的 DATABASE_URL（那是给本机 pnpm 开发用的）
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_secret}@db:5432/${POSTGRES_DB:-geo}?schema=public

      # 下面两个是必改项：缺失时 app 直接启动终止（PAY_MOCK_SECRET 为 fail-closed 校验）
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?CREDENTIAL_MASTER_KEY 未设置：生成命令见 .env.example}
      PAY_MOCK_SECRET: ${PAY_MOCK_SECRET:?PAY_MOCK_SECRET 未设置：缺失时服务 fail-closed 拒绝启动}

      # 向量库与上传目录（挂命名卷，容器重建不丢）
      ZVEC_DATA_PATH: /app/data/zvec
      GEO_UPLOAD_DIR: /app/data/uploads
      ZVEC_DIM: ${ZVEC_DIM:-1024}
      VECTOR_SIMILARITY_THRESHOLD: ${VECTOR_SIMILARITY_THRESHOLD:-0.85}

      # 会话 Cookie 名。默认 __Host-geo_sid 强制 Secure：
      # 裸 IP + 纯 http 部署登录会静默失效，须改 GEO_COOKIE_NAME=geo_sid（见 README）
      GEO_COOKIE_NAME: ${GEO_COOKIE_NAME:-__Host-geo_sid}
      SESSION_IDLE_PLATFORM_HOURS: ${SESSION_IDLE_PLATFORM_HOURS:-8}
      # 计费强制执行（P2 已落地：配额/服务状态/到期只读均生效）。
      # 与 REGISTRATION_ENABLED 双开关联动——开自助注册时本项必须 on。
      BILLING_ENFORCEMENT: ${BILLING_ENFORCEMENT:-off}
      # 自助注册（M2 §3.0）：默认 off。开启需与 BILLING_ENFORCEMENT 同时 on。
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-off}
      # 订阅到期全局宽限天数（缺省 7；试用快照自带 _graceDays=90 不受此项影响）
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PAYMENT_BANK_INFO: ${PAYMENT_BANK_INFO:-}

      # LLM 与监测平台凭证（留空即不启用对应平台；演示站只读浏览不需要）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://open.bigapi.cn/api/paas/v4}
      OPENAI_SEARCH_MODEL: ${OPENAI_SEARCH_MODEL:-gpt-4o-search-preview}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      CHAT_MODEL: ${CHAT_MODEL:-glm-4-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-sonar}
      # Kimi / 元宝：留空不调用。运行时读的是工作区凭证里的同名键；DEMO_MODE=on 时适配器不向外请求。
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.cn/v1}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-kimi-k3}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY:-}
      HUNYUAN_BASE_URL: ${HUNYUAN_BASE_URL:-https://api.hunyuan.cloud.tencent.com/v1}
      HUNYUAN_MODEL: ${HUNYUAN_MODEL:-hunyuan-turbos-latest}
      FUZZY_MATCH_THRESHOLD: ${FUZZY_MATCH_THRESHOLD:--50}

      # 公开只读演示。默认 off，避免把日常自托管锁成只读。
      # on / true / 1 / yes 才会种入 Acme Draw 并拒绝写操作与出站任务。
      DEMO_MODE: ${DEMO_MODE:-off}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo-viewer}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-}
      DEMO_PUBLIC_PASSWORD_HINT: ${DEMO_PUBLIC_PASSWORD_HINT:-}
      DEMO_WORKSPACE_DOMAIN: ${DEMO_WORKSPACE_DOMAIN:-acmedraw.example}
    volumes:
      # zvec 是进程内嵌入式库，落盘目录不挂卷 → 容器重建向量库清零
      - zvec-data:/app/data/zvec
      # 回单 / 发票 PDF 落盘
      - uploads:/app/data/uploads
    mem_limit: 768m

  # ---------- web：nginx 托管前端静态产物 + 反代后端 ----------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    environment:
      GEO_API_UPSTREAM: ${GEO_API_UPSTREAM:-app:4000}
      PORT: '80'
    ports:
      - '${WEB_PORT:-5170}:80'
    mem_limit: 128m

volumes:
  pgdata:
  zvec-data:
  uploads:
